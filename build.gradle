buildscript{
    ext {
        appName = "DynabomberGDX"
        gdxVersion = '1.11.0'
        roboVMVersion = '2.3.16'
        box2DLightsVersion = '1.5'
        ashleyVersion = '1.7.4'
        aiVersion = '1.8.2'
        gdxControllersVersion = '2.2.1'
        assetsSrcDir = "$projectDir/rawAssets/"
        assetsDestDir = "$projectDir/assets/"
        atlasName = "badlogic"
    }
    
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        google()
    }
    dependencies {
        classpath "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
    }
}

import com.badlogic.gdx.tools.texturepacker.TexturePacker

tasks.register('build') {
    //Copy images from rawAssets to the assets folder
    doFirst {
        def srcDir = "$assetsSrcDir"
        def destDir = "$assetsDestDir"
        deleteAllAtlasAndPngFiles(destDir)
        TexturePacker.process(srcDir, destDir, "$atlasName")
    }
    
    ext.deleteAllAtlasAndPngFiles = { dir ->
        //Delete all png and atlas files in destination directory
        FileCollection files = fileTree(dir){
            include '**/*.png'
            include '**/*.atlas'
        }
        project.delete(files)
    }
}

allprojects {
    apply plugin: "eclipse"
    
    version = '1.0'
    
    repositories {
        mavenLocal()
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://jitpack.io" }
    }
}

project(":desktop") {
    apply plugin: "java-library"


    dependencies {
        implementation project(":core")
        //implementation "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        
    }
}

project(":core") {
    apply plugin: "java-library"


    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.ashley:ashley:$ashleyVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        
    }
}